<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      const requestedTheme = new URLSearchParams(location.search).get('theme');
      if (requestedTheme === 'light' || requestedTheme === 'dark') {
        document.documentElement.dataset.theme = requestedTheme;
      }
    </script>
    <title>shadcn-mobile · Compose 交互演示</title>
    <link rel="preload" href="./composeResources/com.shadcn.mobile.web.resources/font/noto_sans_sc_regular.otf" as="fetch" type="font/otf" crossorigin />
    <style>
      :root { --preview-background: #fafafa; --preview-foreground: #18181b; --preview-muted: #71717a; --preview-border: #d4d4d8; color-scheme: light; background: var(--preview-background); }
      :root[data-theme="dark"] { --preview-background: #09090b; --preview-foreground: #fafafa; --preview-muted: #a1a1aa; --preview-border: #3f3f46; color-scheme: dark; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) { --preview-background: #09090b; --preview-foreground: #fafafa; --preview-muted: #a1a1aa; --preview-border: #3f3f46; color-scheme: dark; }
      }
      html, body, #app { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
      body { background: var(--preview-background); color: var(--preview-foreground); font: 14px/1.5 system-ui, sans-serif; }
      #loading { position: fixed; inset: 0; z-index: 1; display: grid; place-content: center; gap: 12px; padding: 32px; text-align: center; background: var(--preview-background); }
      #loading strong { font-size: 16px; font-weight: 600; }
      #loading p { margin: 0; max-width: 360px; color: var(--preview-muted); }
      #loading button { justify-self: center; margin-top: 8px; border: 1px solid var(--preview-border); border-radius: 8px; padding: 10px 18px; background: var(--preview-foreground); color: var(--preview-background); font: inherit; cursor: pointer; }
      #loading[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="app" aria-label="shadcn-mobile Compose 交互演示"></div>
    <div id="loading" role="status" aria-live="polite">
      <strong>正在加载 shadcn-mobile</strong>
      <p>真实 Compose 组件正在启动，首次加载需要一点时间。</p>
    </div>
    <noscript>请启用 JavaScript，并使用支持 WebAssembly GC 的浏览器查看此演示。</noscript>
    <script>
      const loading = document.getElementById('loading');
      window.addEventListener('shadcn-ready', () => { loading.hidden = true; }, { once: true });
      const showFailure = () => {
        if (loading.hidden) return;
        loading.replaceChildren();
        const title = document.createElement('strong');
        title.textContent = 'Compose 预览未能启动';
        const detail = document.createElement('p');
        detail.textContent = '请检查网络连接，并使用新版 Chrome、Edge、Firefox 或 Safari 18.2 及以上版本。';
        const retry = document.createElement('button');
        retry.textContent = '重新加载';
        retry.onclick = () => location.reload();
        loading.append(title, detail, retry);
      };
      window.addEventListener('error', showFailure);
      window.addEventListener('unhandledrejection', showFailure);
      window.setTimeout(() => { if (!loading.hidden) showFailure(); }, 60000);
    </script>
    <script src="./shadcn-mobile.js" defer></script>
  </body>
</html>
