name: Android

on:
  push:
    branches: [main]
    paths: ["androidApp/**", "composeApp/**", "gradle/**", "*.gradle.kts", "gradle.properties", "gradlew", "scripts/ci-android.sh", "scripts/ci-check-tests.py", ".github/workflows/android.yml"]
  pull_request:
    paths: ["androidApp/**", "composeApp/**", "gradle/**", "*.gradle.kts", "gradle.properties", "gradlew", "scripts/ci-android.sh", "scripts/ci-check-tests.py", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, host tests and API 35 interactions
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Install compile SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Build APKs and run shared host tests
        run: >-
          bash ./gradlew :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest
          :composeApp:testAndroidHostTest --stacktrace --console=plain --max-workers=2
      - name: Verify shared test execution
        run: python3 scripts/ci-check-tests.py junit composeApp/build/test-results/testAndroidHostTest 10
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android interaction tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash scripts/ci-android.sh
      - name: Upload APKs, test results and visual evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-results
          path: |
            androidApp/build/outputs/apk/
            composeApp/build/reports/tests/testAndroidHostTest/
            composeApp/build/test-results/testAndroidHostTest/
            build/ci/android/
          if-no-files-found: warn
          retention-days: 7
