name: Docs and Pages

on:
  push:
    branches: [main]
    paths: ["website/**", "docs/**", "composeApp/**", "kotlin-js-store/**", "gradle/**", "*.gradle.kts", "gradle.properties", "gradlew", "scripts/*docs*", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["website/**", "docs/**", "composeApp/**", "kotlin-js-store/**", "gradle/**", "*.gradle.kts", "gradle.properties", "gradlew", "scripts/*docs*", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Shared Compose browser demo and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Build the shared Compose Wasm demo
        run: bash ./gradlew :composeApp:wasmJsBrowserDistribution --stacktrace --console=plain --max-workers=2
      - name: Build documentation
        run: node scripts/build-docs.mjs
      - name: Validate the published site and demo assets
        run: node website/verify.mjs --dist
      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist
          retention-days: 7

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure the existing Pages site
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy the validated artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
