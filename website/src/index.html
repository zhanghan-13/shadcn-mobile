<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="shadcn-mobile：面向 Android 与 iOS 的 Compose 组件原型。在线体验真实共享组件，查看 Kotlin API、主题令牌和运行指南。">
  <title>shadcn-mobile — 原生 Compose 组件</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <script>try{const t=localStorage.getItem('shadcn-mobile-docs-theme');document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch{document.documentElement.dataset.theme='light'}</script>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到内容</a>
  <header class="topbar">
    <div class="topbar-inner">
      <button class="icon-button mobile-menu" id="menu-toggle" aria-label="打开文档目录" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <a class="brand" href="#/overview" aria-label="shadcn-mobile 文档首页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20 20 4M13 20l7-7"/></svg>
        <span>shadcn-mobile</span>
      </a>
      <nav class="top-nav" aria-label="主导航">
        <a href="#/overview" data-top-nav="docs">文档</a>
        <a href="#/components/button" data-top-nav="components">组件</a>
      </nav>
      <div class="top-actions">
        <button class="search-trigger" id="search-trigger" aria-label="搜索文档，快捷键 Control 或 Command 加 K">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/></svg>
          <span>搜索文档…</span><kbd>⌘ K</kbd>
        </button>
        <a class="icon-button github-link" href="https://github.com/zhanghan-13/shadcn-mobile" target="_blank" rel="noopener noreferrer" aria-label="打开 GitHub 仓库">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 19c-4.3 1.3-4.3-2.2-6-2.7m12 5v-3.9a3.4 3.4 0 0 0-.9-2.7c3-.3 6.1-1.5 6.1-6.8A5.3 5.3 0 0 0 18.7 4 5 5 0 0 0 18.6.4S17.4 0 14.7 1.9a13.4 13.4 0 0 0-7.1 0C4.9 0 3.7.4 3.7.4A5 5 0 0 0 3.6 4a5.3 5.3 0 0 0-1.5 3.9c0 5.3 3.1 6.5 6.1 6.8a3.4 3.4 0 0 0-.9 2.7v3.9" transform="translate(1.2 1) scale(.9)"/></svg>

        <span class="header-divider" aria-hidden="true"></span>
        <button class="icon-button" id="theme-toggle" aria-label="切换到深色主题"></button>
      </div>
    </div>
  </header>
  <div class="page-shell">
    <div class="sidebar-shade" id="sidebar-shade" hidden></div>
    <aside class="sidebar" id="sidebar" aria-label="文档目录">
      <div class="sidebar-mobile-title"><span>文档目录</span><button class="icon-button" id="menu-close" aria-label="关闭目录"></button></div>
      <nav id="side-navigation"></nav>
      <div class="sidebar-bottom"><span class="status-mark" aria-hidden="true"></span><span>可运行的早期原型</span></div>
    </aside>
    <main id="main" tabindex="-1"></main>
    <aside class="toc" aria-label="本页内容"><div id="toc-content"></div></aside>
  </div>
  <dialog id="search-dialog" class="search-dialog" aria-labelledby="search-title">
    <div class="search-input-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/></svg>

      <button class="search-close" id="search-close" aria-label="关闭搜索">Esc</button>
    </div>
    <div class="search-results" id="search-results" role="listbox" aria-label="文档搜索结果" aria-live="polite"></div>
    <div class="search-footer">输入中文或英文查找文档 <span>↑ ↓ 选择 · Enter 打开</span></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="noscript">文档的搜索与交互预览需要 JavaScript。你也可以打开<a href="https://github.com/zhanghan-13/shadcn-mobile">GitHub 仓库</a>。</p></noscript>

</html>
